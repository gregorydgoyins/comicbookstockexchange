name: Daily PriceCharting Ingestion Worker

on:
  schedule:
    # Runs at 02:00 UTC daily (after US auction hammer closes)
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: daily-pricecharting-ingest
  cancel-in-progress: true

jobs:
  ingest:
    name: Run Automated PriceCharting Market Feed Ingest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily PriceCharting Ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRICECHARTING_API_TOKEN: ${{ secrets.PRICECHARTING_API_TOKEN }}
        run: node scripts/pricecharting-nightly-cloud.mjs
